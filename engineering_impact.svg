<svg width="600" height="308" viewBox="0 0 600 308" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg   { fill: #f6f8fa; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .div  { stroke: #d0d7de; stroke-width: 0.5; }
    .title{ fill: #1f2328; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 15px; font-weight: 600; }
    .lbl  { fill: #57606a; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 12px; }
    .pct  { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; font-weight: 600; }
    .trk  { fill: #eaeef2; }
    .tg   { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 10px; }
    .dn-b { fill: #dafbe1; }
    .dn-t { fill: #1a7f37; }
    .up-b { fill: #ddf4ff; }
    .up-t { fill: #0969da; }
    .ft   { fill: #8b949e; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 10px; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .div  { stroke: #30363d; }
      .title{ fill: #e6edf3; }
      .lbl  { fill: #8b949e; }
      .trk  { fill: #21262d; }
      .dn-b { fill: #122d1a; }
      .dn-t { fill: #3fb950; }
      .up-b { fill: #031d2e; }
      .up-t { fill: #58a6ff; }
      .ft   { fill: #484f58; }
    }
  </style>

  <!-- Card -->
  <rect width="600" height="308" rx="8" class="bg"/>
  <rect x="1" y="1" width="598" height="306" rx="7" class="card"/>

  <!-- Title -->
  <text x="24" y="40" class="title">⚡ Engineering Impact</text>
  <line x1="24" y1="52" x2="576" y2="52" class="div"/>

  <!-- ── ROW 1 · Manual verification 80% ── -->
  <text x="24"  y="80"  class="lbl">Manual verification effort</text>
  <rect x="200" y="67" width="56" height="15" rx="7" class="dn-b"/>
  <text x="228" y="78"  text-anchor="middle" class="tg dn-t">↓ reduced</text>
  <text x="578" y="80"  text-anchor="end" fill="#1D9E75" class="pct">80%</text>
  <rect x="24"  y="88"  width="400" height="8" rx="4" class="trk"/>
  <rect x="24"  y="88"  width="0"   height="8" rx="4" fill="#1D9E75">
    <animate attributeName="width" from="0" to="320" dur="0.9s" begin="0.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- ── ROW 2 · ML deployment time 40% ── -->
  <text x="24"  y="124" class="lbl">ML deployment time</text>
  <rect x="162" y="111" width="56" height="15" rx="7" class="dn-b"/>
  <text x="190" y="122" text-anchor="middle" class="tg dn-t">↓ reduced</text>
  <text x="578" y="124" text-anchor="end" fill="#378ADD" class="pct">40%</text>
  <rect x="24"  y="132" width="400" height="8" rx="4" class="trk"/>
  <rect x="24"  y="132" width="0"   height="8" rx="4" fill="#378ADD">
    <animate attributeName="width" from="0" to="160" dur="0.9s" begin="0.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- ── ROW 3 · Token consumption 40% ── -->
  <text x="24"  y="168" class="lbl">Token consumption</text>
  <rect x="152" y="155" width="56" height="15" rx="7" class="dn-b"/>
  <text x="180" y="166" text-anchor="middle" class="tg dn-t">↓ reduced</text>
  <text x="578" y="168" text-anchor="end" fill="#5A86C4" class="pct">40%</text>
  <rect x="24"  y="176" width="400" height="8" rx="4" class="trk"/>
  <rect x="24"  y="176" width="0"   height="8" rx="4" fill="#5A86C4">
    <animate attributeName="width" from="0" to="160" dur="0.9s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- ── ROW 4 · Model accuracy 45% ── -->
  <text x="24"  y="212" class="lbl">Model accuracy</text>
  <rect x="130" y="199" width="58" height="15" rx="7" class="up-b"/>
  <text x="159" y="210" text-anchor="middle" class="tg up-t">↑ improved</text>
  <text x="578" y="212" text-anchor="end" fill="#D85A30" class="pct">45%</text>
  <rect x="24"  y="220" width="400" height="8" rx="4" class="trk"/>
  <rect x="24"  y="220" width="0"   height="8" rx="4" fill="#D85A30">
    <animate attributeName="width" from="0" to="180" dur="0.9s" begin="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- ── ROW 5 · Retrieval precision 35% ── -->
  <text x="24"  y="256" class="lbl">Retrieval precision</text>
  <rect x="154" y="243" width="58" height="15" rx="7" class="up-b"/>
  <text x="183" y="254" text-anchor="middle" class="tg up-t">↑ improved</text>
  <text x="578" y="256" text-anchor="end" fill="#BA7517" class="pct">35%</text>
  <rect x="24"  y="264" width="400" height="8" rx="4" class="trk"/>
  <rect x="24"  y="264" width="0"   height="8" rx="4" fill="#BA7517">
    <animate attributeName="width" from="0" to="140" dur="0.9s" begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- Footer -->
  <line x1="24" y1="284" x2="576" y2="284" class="div"/>
  <text x="24"  y="297" class="ft">Gaurav Patil · AI/ML Engineer · Mumbai, India</text>
</svg>
